// ============================
// Page Content Renderer (Canvas)
// ============================
const PAGE_WIDTH = 512;
const PAGE_HEIGHT = 700;
const BG_COLOR = '#f5f0e8';
const BG_DARK = '#e8e0d4';
const TEXT_COLOR = '#2c2c2c';
const MUTED = '#6b6257';
const ACCENT = '#e94560';
const SURFACE = '#16213e';
const ACCENT_BLUE = '#0f3460';

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const chars = text.split('');
  let line = '';
  let cy = y;
  for (let i = 0; i < chars.length; i++) {
    const testLine = line + chars[i];
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && i > 0) {
      ctx.fillText(line, x, cy);
      line = chars[i];
      cy += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, cy);
  return cy + lineHeight;
}

function drawCodeBlock(ctx, x, y, w, code, lang) {
  const pad = 14;
  const lineH = 18;
  const lines = code.split('\n');
  const h = pad * 2 + lines.length * lineH;

  ctx.fillStyle = '#2d2d2d';
  roundRect(ctx, x, y, w, h, 6);
  ctx.fill();

  if (lang) {
    ctx.fillStyle = '#555';
    ctx.font = '10px "Noto Sans JP", sans-serif';
    ctx.fillText(lang, x + pad, y - 6);
  }

  ctx.font = '12px "Courier New", monospace';
  let cy = y + pad + 12;
  lines.forEach(line => {
    let px = x + pad;
    // Simple syntax highlighting
    const tokens = tokenizeCode(line);
    tokens.forEach(tok => {
      if (tok.type === 'comment') ctx.fillStyle = '#75715e';
      else if (tok.type === 'keyword') ctx.fillStyle = '#66d9ef';
      else if (tok.type === 'string') ctx.fillStyle = '#a6e22e';
      else if (tok.type === 'function') ctx.fillStyle = '#fd971f';
      else ctx.fillStyle = '#f8f8f2';
      ctx.fillText(tok.text, px, cy);
      px += ctx.measureText(tok.text).width;
    });
    cy += lineH;
  });
  return y + h + 14;
}

function tokenizeCode(line) {
  const keywords = ['def','return','import','from','class','if','else','for','while','const','let','var','function','=>','public','static','void','int','#include'];
  const tokens = [];
  let remaining = line;
  while (remaining.length > 0) {
    // comment
    if (remaining.match(/^\/\/.*/) || remaining.match(/^#.*/)) {
      tokens.push({text: remaining, type: 'comment'});
      break;
    }
    // string
    const strMatch = remaining.match(/^"[^"]*"/) || remaining.match(/^'[^']*'/);
    if (strMatch) {
      tokens.push({text: strMatch[0], type: 'string'});
      remaining = remaining.slice(strMatch[0].length);
      continue;
    }
    // keyword / identifier
    const wordMatch = remaining.match(/^[A-Za-z_#][A-Za-z0-9_]*/);
    if (wordMatch) {
      const w = wordMatch[0];
      const type = keywords.includes(w) || keywords.some(k => w.includes(k)) ? 'keyword' : 
                   remaining.length > w.length && remaining[w.length] === '(' ? 'function' : 'normal';
      tokens.push({text: w, type: type === 'normal' ? 'normal' : type});
      remaining = remaining.slice(w.length);
      continue;
    }
    // other char
    tokens.push({text: remaining[0], type: 'normal'});
    remaining = remaining.slice(1);
  }
  return tokens;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawMdExample(ctx, x, y, w, md) {
  const pad = 12;
  ctx.fillStyle = '#fff';
  roundRect(ctx, x, y, w, 80, 6);
  ctx.fill();
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = TEXT_COLOR;
  ctx.font = '12px "Noto Sans JP", sans-serif';
  const lines = md.split('\n');
  let cy = y + pad + 12;
  lines.forEach(ln => {
    ctx.fillText(ln, x + pad, cy);
    cy += 16;
  });
  return y + 80 + 10;
}

function drawMdResult(ctx, x, y, w, lines) {
  const pad = 10;
  const lineH = 18;
  const h = pad * 2 + lines.length * lineH;
  ctx.fillStyle = '#f0f4f8';
  ctx.beginPath();
  ctx.moveTo(x + 3, y);
  ctx.lineTo(x + w, y);
  ctx.lineTo(x + w, y + h);
  ctx.lineTo(x + 3, y + h);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = ACCENT;
  ctx.fillRect(x, y, 3, h);
  ctx.fillStyle = TEXT_COLOR;
  ctx.font = '12px "Noto Sans JP", sans-serif';
  let cy = y + pad + 12;
  lines.forEach(ln => {
    ctx.fillText(ln, x + pad + 6, cy);
    cy += lineH;
  });
  return y + h + 12;
}

function renderPageToCanvas(pageIndex, isBack = false) {
  const canvas = document.createElement('canvas');
  canvas.width = PAGE_WIDTH;
  canvas.height = PAGE_HEIGHT;
  const ctx = canvas.getContext('2d');
  const data = pageData[pageIndex];

  if (!data) return canvas;

  // Background
  ctx.fillStyle = isBack ? BG_DARK : BG_COLOR;
  ctx.fillRect(0, 0, PAGE_WIDTH, PAGE_HEIGHT);

  // Page shadow gradient at spine
  const grad = ctx.createLinearGradient(isBack ? PAGE_WIDTH - 30 : 0, 0, isBack ? PAGE_WIDTH : 30, 0);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.06)');
  ctx.fillStyle = grad;
  ctx.fillRect(isBack ? PAGE_WIDTH - 30 : 0, 0, 30, PAGE_HEIGHT);

  if (data.type === 'cover') {
    const grd = ctx.createLinearGradient(0, 0, PAGE_WIDTH, PAGE_HEIGHT);
    grd.addColorStop(0, SURFACE);
    grd.addColorStop(1, ACCENT_BLUE);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, PAGE_WIDTH, PAGE_HEIGHT);

    ctx.fillStyle = ACCENT;
    ctx.fillRect(PAGE_WIDTH/2 - 60, PAGE_HEIGHT/2 - 60, 120, 3);

    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '700 28px "Noto Serif JP", serif';
    const titleLines = data.title.split('\n');
    let ty = PAGE_HEIGHT/2 - 20;
    titleLines.forEach(ln => {
      ctx.fillText(ln, PAGE_WIDTH/2, ty);
      ty += 38;
    });

    ctx.font = '300 16px "Noto Sans JP", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText(data.subtitle, PAGE_WIDTH/2, ty + 20);

    ctx.fillStyle = ACCENT;
    ctx.fillRect(PAGE_WIDTH/2 - 60, ty + 40, 120, 3);

    ctx.font = '14px "Noto Sans JP", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(data.author, PAGE_WIDTH/2, PAGE_HEIGHT - 80);
    ctx.textAlign = 'left';
  }
  else if (data.type === 'back') {
    const grd = ctx.createLinearGradient(0, 0, PAGE_WIDTH, PAGE_HEIGHT);
    grd.addColorStop(0, ACCENT_BLUE);
    grd.addColorStop(1, SURFACE);
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, PAGE_WIDTH, PAGE_HEIGHT);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = '700 32px "Noto Serif JP", serif';
    ctx.fillText(data.text, PAGE_WIDTH/2, PAGE_HEIGHT/2 - 20);
    ctx.fillStyle = ACCENT;
    ctx.fillRect(PAGE_WIDTH/2 - 40, PAGE_HEIGHT/2 + 10, 80, 3);
    ctx.font = '14px "Noto Sans JP", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    const subLines = data.sub.split('\n');
    let sy = PAGE_HEIGHT/2 + 40;
    subLines.forEach(ln => {
      ctx.fillText(ln, PAGE_WIDTH/2, sy);
      sy += 22;
    });
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '12px "Noto Sans JP", sans-serif';
    ctx.fillText('Three.js 3Dフリップブック', PAGE_WIDTH/2, PAGE_HEIGHT - 60);
    ctx.textAlign = 'left';
  }
  else if (data.type === 'toc') {
    ctx.fillStyle = TEXT_COLOR;
    ctx.font = '700 22px "Noto Serif JP", serif';
    ctx.fillText('目次', 40, 60);
    ctx.fillStyle = ACCENT;
    ctx.fillRect(40, 72, 60, 3);

    let ty = 110;
    ctx.font = '14px "Noto Sans JP", sans-serif';
    data.items.forEach(item => {
      ctx.fillStyle = '#ccc';
      ctx.fillRect(40, ty + 4, PAGE_WIDTH - 80, 1);
      ctx.fillStyle = TEXT_COLOR;
      ctx.fillText(item.label, 40, ty + 22);
      ctx.fillStyle = MUTED;
      ctx.fillText('p.' + item.page, PAGE_WIDTH - 70, ty + 22);
      ty += 44;
    });
  }
  else if (data.type === 'content') {
    const margin = 36;
    const w = PAGE_WIDTH - margin * 2;
    let y = 50;

    ctx.fillStyle = SURFACE;
    ctx.font = '700 20px "Noto Serif JP", serif';
    ctx.fillText(data.title, margin, y);
    y += 10;
    ctx.fillStyle = ACCENT;
    ctx.fillRect(margin, y, 80, 3);
    y += 28;

    ctx.font = '13px "Noto Sans JP", sans-serif';

    data.body.forEach(block => {
      if (block.h3) {
        ctx.fillStyle = ACCENT_BLUE;
        ctx.font = '700 14px "Noto Sans JP", sans-serif';
        ctx.fillText(block.h3, margin, y);
        y += 22;
      }
      if (block.p) {
        ctx.fillStyle = TEXT_COLOR;
        ctx.font = '13px "Noto Sans JP", sans-serif';
        y = wrapText(ctx, block.p, margin, y, w, 20) + 6;
      }
      if (block.ul) {
        block.ul.forEach(item => {
          ctx.fillStyle = ACCENT;
          ctx.beginPath();
          ctx.arc(margin + 4, y - 4, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = TEXT_COLOR;
          ctx.font = '12px "Noto Sans JP", sans-serif';
          // Bold parts
          const parts = item.split('：');
          if (parts.length === 2) {
            ctx.font = '700 12px "Noto Sans JP", sans-serif';
            ctx.fillText(parts[0] + '：', margin + 14, y);
            const bw = ctx.measureText(parts[0] + '：').width;
            ctx.font = '12px "Noto Sans JP", sans-serif';
            ctx.fillText(parts[1], margin + 14 + bw, y);
          } else {
            ctx.fillText(item, margin + 14, y);
          }
          y += 20;
        });
        y += 6;
      }
      if (block.code) {
        y = drawCodeBlock(ctx, margin, y, w, block.code, block.lang) + 4;
      }
      if (block.md) {
        y = drawMdExample(ctx, margin, y, w, block.md) + 4;
      }
      if (block.result) {
        y = drawMdResult(ctx, margin, y, w, block.result) + 4;
      }
      if (block.center) {
        ctx.textAlign = 'center';
        ctx.fillStyle = MUTED;
        ctx.font = '12px "Noto Sans JP", sans-serif';
        ctx.fillText(block.center, PAGE_WIDTH/2, y);
        ctx.textAlign = 'left';
        y += 24;
      }
    });
  }

  // Page number
  ctx.fillStyle = MUTED;
  ctx.font = '11px "Noto Sans JP", sans-serif';
  ctx.textAlign = isBack ? 'left' : 'right';
  const pn = isBack ? (pageIndex * 2 + 2) : (pageIndex * 2 + 1);
  ctx.fillText(String(pn), isBack ? 36 : PAGE_WIDTH - 36, PAGE_HEIGHT - 20);
  ctx.textAlign = 'left';

  return canvas;
}

// ============================
// Three.js 3D Book
// ============================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 4, 10);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.6, 5.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
dirLight.position.set(3, 5, 4);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.near = 0.1;
dirLight.shadow.camera.far = 20;
dirLight.shadow.bias = -0.001;
scene.add(dirLight);

const spotLight = new THREE.SpotLight(0xe94560, 0.3);
spotLight.position.set(-3, 4, 2);
spotLight.lookAt(0, 0, 0);
scene.add(spotLight);

// Ground shadow
const groundGeo = new THREE.PlaneGeometry(15, 15);
const groundMat = new THREE.MeshStandardMaterial({ 
  color: 0x1a1a2e,
  roughness: 1,
  metalness: 0 
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.6;
ground.receiveShadow = true;
scene.add(ground);

// Page dimensions
const PAGE_W = 1.5;
const PAGE_H = 2.1;
const PAGE_SEGS = 64;

// Vertex Shader for page flip
const vertexShader = `
uniform float uProgress;
varying vec2 vUv;
varying float vLight;

const float PI = 3.14159265359;

void main() {
  vUv = uv;
  vec3 pos = position;

  // x: -0.5 to 0.5 in geometry space
  // We map so that right edge (x=0.5) is the spine
  float x = uv.x; // 0 to 1, 0=left edge, 1=spine

  float flip = uProgress * PI;

  // Rotation amount: max at free edge (x=0), zero at spine (x=1)
  float angle = flip * pow(1.0 - x, 0.85);

  float c = cos(angle);
  float s = sin(angle);

  // Distance from spine
  float dist = (1.0 - x) * PAGE_W;

  // Rotate around spine axis
  float targetX = -dist * c * 0.5 + (1.0 - x) * (-0.5 * uProgress * PAGE_W) + x * (0.5 * (1.0 - uProgress) * PAGE_W) + (x - 0.5) * PAGE_W * 0.5;

  // Better approach: transform in local space
  // Original x ranges from -PAGE_W/2 to +PAGE_W/2
  // Right edge (+PAGE_W/2) stays, left edge moves
  float rx = pos.x - PAGE_W * 0.5; // distance from right edge: 0 at spine, -PAGE_W at free edge

  // When progress=0: page is on right, rx goes from -PAGE_W to 0
  // When progress=1: page is on left, rx goes from 0 to -PAGE_W (but mirrored)

  float rot = flip * pow(1.0 - x, 0.8);
  float nc = cos(rot);
  float ns = sin(rot);

  // New position
  float nx = rx * nc;
  float nz = rx * ns * 0.5;

  // Shift based on progress
  // progress=0: x should be positive (right side)
  // progress=1: x should be negative (left side)
  float xShift = mix(0.0, -PAGE_W, uProgress);

  pos.x = PAGE_W * 0.5 + nx + xShift;
  pos.z = nz;

  // Curl effect in the middle of the flip
  float curl = sin(flip) * 0.12 * sin(x * PI) * (1.0 - abs(uProgress - 0.5) * 2.0);
  pos.y += curl;

  // Slight lift when flipping
  pos.y += sin(flip * 0.5) * 0.05 * (1.0 - x);

  // Simple lighting based on normal approximation
  vLight = 0.8 + 0.2 * sin(rot);

  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
}
`;

const fragmentShader = `
uniform sampler2D uTextureFront;
uniform sampler2D uTextureBack;
uniform float uProgress;
varying vec2 vUv;
varying float vLight;

void main() {
  vec2 uv = vUv;
  // For back face, flip x
  if (!gl_FrontFacing) {
    uv.x = 1.0 - uv.x;
  }

  vec4 color;
  if (gl_FrontFacing) {
    color = texture2D(uTextureFront, uv);
  } else {
    color = texture2D(uTextureBack, uv);
  }

  // Apply subtle lighting
  color.rgb *= vLight;

  // Page edge shadow near spine
  float spineShadow = smoothstep(0.0, 0.15, uv.x);
  color.rgb *= 0.85 + 0.15 * spineShadow;

  gl_FragColor = color;
}
`;

// Replace PAGE_W in shader
const vertexShaderFinal = vertexShader.replace(/PAGE_W/g, PAGE_W.toFixed(2));

class Book3D {
  constructor() {
    this.pages = [];
    this.currentPage = 0;
    this.totalPages = 8;
    this.isAnimating = false;
    this.init();
  }

  init() {
    const geometry = new THREE.PlaneGeometry(PAGE_W, PAGE_H, PAGE_SEGS, PAGE_SEGS);

    for (let i = 0; i < this.totalPages; i++) {
      const frontCanvas = renderPageToCanvas(i, false);
      const backCanvas = renderPageToCanvas(i, true);

      const frontTex = new THREE.CanvasTexture(frontCanvas);
      const backTex = new THREE.CanvasTexture(backCanvas);

      frontTex.minFilter = THREE.LinearFilter;
      backTex.minFilter = THREE.LinearFilter;

      const material = new THREE.ShaderMaterial({
        vertexShader: vertexShaderFinal,
        fragmentShader: fragmentShader,
        uniforms: {
          uTextureFront: { value: frontTex },
          uTextureBack: { value: backTex },
          uProgress: { value: 0.0 }
        },
        side: THREE.DoubleSide,
        transparent: false
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.z = i * 0.008;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      this.pages.push({ mesh, material, index: i });
    }

    this.updateButtons();
  }

  nextPage() {
    if (this.isAnimating || this.currentPage >= this.totalPages - 1) return;
    this.isAnimating = true;

    const page = this.pages[this.currentPage];

    // Bring current page to top during flip
    this.pages.forEach((p, i) => {
      p.mesh.position.z = (i === this.currentPage) ? 0.1 : (i < this.currentPage ? -0.01 : i * 0.008);
    });

    gsap.to(page.material.uniforms.uProgress, {
      value: 1.0,
      duration: 1.3,
      ease: "power2.inOut",
      onComplete: () => {
        this.currentPage++;
        this.isAnimating = false;
        this.updateZOrder();
        this.updateButtons();
      }
    });
  }

  prevPage() {
    if (this.isAnimating || this.currentPage <= 0) return;
    this.isAnimating = true;

    this.currentPage--;
    const page = this.pages[this.currentPage];

    this.pages.forEach((p, i) => {
      p.mesh.position.z = (i === this.currentPage) ? 0.1 : (i < this.currentPage ? -0.01 : i * 0.008);
    });

    gsap.to(page.material.uniforms.uProgress, {
      value: 0.0,
      duration: 1.3,
      ease: "power2.inOut",
      onComplete: () => {
        this.isAnimating = false;
        this.updateZOrder();
        this.updateButtons();
      }
    });
  }

  updateZOrder() {
    this.pages.forEach((p, i) => {
      if (i < this.currentPage) {
        p.mesh.position.z = -0.01 - (this.currentPage - i) * 0.002;
      } else {
        p.mesh.position.z = (i - this.currentPage) * 0.008;
      }
    });
  }

  updateButtons() {
    document.getElementById('prevBtn').disabled = this.currentPage === 0;
    document.getElementById('nextBtn').disabled = this.currentPage >= this.totalPages - 1;
    document.getElementById('pageIndicator').textContent = (this.currentPage + 1) + ' / ' + this.totalPages;
  }

  goToPage(n) {
    if (n === this.currentPage) return;
    if (n > this.currentPage) {
      let steps = n - this.currentPage;
      const flipNext = () => {
        if (steps > 0) {
          steps--;
          this.nextPage();
          setTimeout(flipNext, 400);
        }
      };
      flipNext();
    } else {
      let steps = this.currentPage - n;
      const flipPrev = () => {
        if (steps > 0) {
          steps--;
          this.prevPage();
          setTimeout(flipPrev, 400);
        }
      };
      flipPrev();
    }
  }
}

// ============================
// Initialize
// ============================
let book;

function updateProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

async function initApp() {
  // Wait for fonts
  updateProgress(20);
  await document.fonts.ready;
  updateProgress(50);

  // Create book
  book = new Book3D();
  updateProgress(100);

  setTimeout(() => {
    document.getElementById('loading').classList.add('hidden');
  }, 500);

  animate();
}

function animate() {
  requestAnimationFrame(animate);

  // Subtle camera movement based on mouse
  const targetX = mouse.x * 0.3;
  const targetY = 1.6 + mouse.y * 0.1;
  camera.position.x += (targetX - camera.position.x) * 0.05;
  camera.position.y += (targetY - camera.position.y) * 0.05;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}

// Mouse tracking
const mouse = { x: 0, y: 0 };
document.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') book.nextPage();
  if (e.key === 'ArrowLeft') book.prevPage();
});

// Touch / swipe
let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener('touchend', e => {
  const diff = touchStartX - e.changedTouches[0].screenX;
  if (Math.abs(diff) > 50) {
    diff > 0 ? book.nextPage() : book.prevPage();
  }
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Start
initApp();
</script>
