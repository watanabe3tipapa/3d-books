/* ---- 本棚（棚ページと開幕アニメーションで共用） ---- */
.shelf-room {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 1800px;
  perspective-origin: 50% 42%;
}

.shelf-room::before {
  content: "";
  position: absolute;
  inset: -10%;
  background:
    radial-gradient(ellipse at 50% 18%, rgba(201, 162, 39, 0.16), transparent 55%),
    radial-gradient(ellipse at 20% 75%, rgba(233, 69, 96, 0.08), transparent 45%);
  pointer-events: none;
}

.shelf-cabinet {
  position: relative;
  width: min(1000px, 92vw);
  padding: 28px 38px 20px;
  border-radius: 8px;
  background:
    linear-gradient(90deg, rgba(255,255,255,0.05), transparent 10%, transparent 90%, rgba(0,0,0,0.25)),
    linear-gradient(180deg, #4a3122 0%, #352216 45%, #28180f 100%);
  border: 1px solid rgba(231, 205, 114, 0.16);
  box-shadow:
    0 40px 90px rgba(0, 0, 0, 0.65),
    0 6px 0 #1b110b,
    inset 0 1px 0 rgba(255, 226, 170, 0.16);
  transform: rotateX(2.2deg);
}

.shelf-cabinet::before,
.shelf-cabinet::after {
  content: "";
  position: absolute;
  top: 10px;
  bottom: 10px;
  width: 14px;
  border-radius: 3px;
  background: linear-gradient(90deg, #1c120b, #4a3122 45%, #2b1a11);
  box-shadow: inset 0 0 0 1px rgba(231, 205, 114, 0.1);
}
.shelf-cabinet::before { left: 9px; }
.shelf-cabinet::after { right: 9px; }

.shelf-inner {
  position: relative;
  padding: 18px 22px 0;
  border-radius: 4px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(201, 162, 39, 0.1), transparent 60%),
    linear-gradient(180deg, #120d09 0%, #1b130d 60%, #0e0906 100%);
  box-shadow:
    inset 0 20px 40px rgba(0, 0, 0, 0.8),
    inset 0 0 0 1px rgba(0, 0, 0, 0.6);
  overflow: hidden;
}

.shelf-row {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: clamp(4px, 0.8vw, 11px);
  min-height: 318px;
  padding: 0 clamp(6px, 1.4vw, 18px);
  z-index: 1;
}

.shelf-row::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 28px;
  background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.55));
  pointer-events: none;
}

.shelf-board {
  position: relative;
  height: 18px;
  margin: 0 -22px;
  background:
    linear-gradient(180deg, #6b472e 0%, #4a2e1e 22%, #2c1a10 78%, #1a0f09 100%);
  border-top: 1px solid rgba(255, 224, 166, 0.22);
  box-shadow:
    0 10px 18px rgba(0, 0, 0, 0.55),
    inset 0 -2px 0 rgba(0, 0, 0, 0.5);
  z-index: 2;
}

.shelf-board::after {
  content: "";
  position: absolute;
  left: 6%;
  right: 6%;
  top: 4px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(231, 205, 114, 0.28), transparent);
}

.shelf-caption {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 14px 6px 0;
  color: rgba(245, 240, 232, 0.46);
  font-size: 0.68rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

/* 背表紙 */
.spine {
  position: relative;
  flex: 0 0 auto;
  width: var(--w, 46px);
  height: var(--h, 296px);
  border-radius: 2px 3px 3px 2px;
  background:
    linear-gradient(90deg, rgba(255, 255, 255, 0.22), transparent 14%, transparent 82%, rgba(0, 0, 0, 0.32)),
    linear-gradient(180deg, var(--c1, #5a3a2a), var(--c2, #2c1a12));
  border: 1px solid rgba(255, 240, 210, 0.1);
  box-shadow:
    inset 1px 0 0 rgba(255, 235, 200, 0.18),
    inset -2px 0 4px rgba(0, 0, 0, 0.35),
    0 5px 12px rgba(0, 0, 0, 0.45);
  color: var(--paper);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px 0;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-family: var(--serif);
  font-size: clamp(0.7rem, 0.9vw, 0.84rem);
  font-weight: 600;
  letter-spacing: 0.1em;
  line-height: 1.2;
  cursor: pointer;
  transform-style: preserve-3d;
  transform: translateZ(0);
  transition: transform 0.38s cubic-bezier(0.22, 0.8, 0.2, 1), box-shadow 0.38s ease, filter 0.38s ease;
  user-select: none;
  overflow: hidden;
}

.spine::before,
.spine::after {
  content: "";
  position: absolute;
  left: 8%;
  right: 8%;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(231, 205, 114, 0.72), transparent);
  opacity: 0.8;
}
.spine::before { top: 12px; }
.spine::after { bottom: 12px; }

.spine .spine-title {
  max-height: calc(100% - 44px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}

.spine .spine-dot {
  position: absolute;
  top: 8px;
  left: 50%;
  width: 5px;
  height: 5px;
  margin-left: -2.5px;
  border-radius: 50%;
  background: var(--gold-soft);
  box-shadow: 0 0 8px rgba(231, 205, 114, 0.75);
}

.spine:hover,
.spine:focus-visible,
.spine.current {
  transform: translateY(-16px) translateZ(34px) rotateY(-5deg);
  box-shadow:
    inset 1px 0 0 rgba(255, 235, 200, 0.25),
    0 22px 30px rgba(0, 0, 0, 0.55),
    0 0 0 1px rgba(231, 205, 114, 0.55),
    0 0 26px rgba(201, 162, 39, 0.28);
  outline: none;
  filter: brightness(1.12);
}

.spine.current {
  transform: translateY(-22px) translateZ(52px) rotateY(-4deg);
}

.spine:active {
  transform: translateY(-8px) translateZ(20px) rotateY(-2deg);
}

.skip-btn {

<script>

(function () {
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let active = false;

  const esc = (value) =>
    String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

  function play(spine, options) {
    options = options || {};
    if (active) return;
    if (reduced) {
      if (options.onDone) options.onDone();
      return;
    }

    active = true;
    const rect = spine.getBoundingClientRect();
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const targetW = Math.min(380, window.innerWidth * 0.72, window.innerHeight * 0.46);
    const targetH = targetW * 1.36;
    const dx = rect.left + rect.width / 2 - cx;
    const dy = rect.top + rect.height / 2 - cy;
    const title = spine.dataset.title || "";
    const subtitle = spine.dataset.subtitle || "";
    const author = spine.dataset.author || "";
    const c1 = spine.dataset.c1 || "#5a3a2a";
    const c2 = spine.dataset.c2 || "#2c1a12";

    const layer = document.createElement("div");
    layer.className = "takeout-layer";
    layer.innerHTML = [
      '<div class="tb-spine" style="left:' + rect.left + "px;top:" + rect.top +
        "px;width:" + rect.width + "px;height:" + rect.height +
        "px;--c1:" + c1 + ";--c2:" + c2 + '">' + esc(title) + "</div>",
      '<div class="tb-book" style="left:' + (cx - targetW / 2) + "px;top:" + (cy - targetH / 2) +
        "px;width:" + targetW + "px;height:" + targetH + "px;font-size:" +
        Math.max(13, Math.min(22, targetW / 26)) + 'px">',
      '  <div class="tb-pages"></div>',
      '  <div class="tb-cover">',
      '    <div class="tb-cover-front">',
      '      <span class="tb-kicker">3D BOOKS / VOLUME</span>',
      '      <span class="tb-title">' + esc(title) + "</span>",
      '      <span class="tb-sub">' + esc(subtitle) + "</span>",
      '      <span class="tb-author">' + esc(author) + "</span>",
      "    </div>",
      '    <div class="tb-cover-back"></div>',
      "  </div>",
      "</div>",
      '<div class="takeout-caption"><span>本棚から取り出しています…</span><button type="button" class="skip-btn">スキップ</button></div>',
    ].join("");

    document.body.appendChild(layer);
    const spineEl = layer.querySelector(".tb-spine");
    const bookEl = layer.querySelector(".tb-book");
    const coverEl = layer.querySelector(".tb-cover");
    const animations = [];
    let finished = false;

    const finish = (immediate) => {
      if (finished) return;
      finished = true;
      animations.forEach((animation) => {
        try { animation.cancel(); } catch (error) { /* noop */ }
      });
      layer.classList.add("done");
      window.setTimeout(() => {
        layer.remove();
        active = false;
        if (options.onDone) options.onDone();
      }, immediate ? 120 : 480);
    };

    const skip = (event) => {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      finish(true);
    };
    layer.addEventListener("click", (event) => {
      if (event.target.closest(".skip-btn") || event.target === layer) skip(event);
    });
    const onKey = (event) => {
      if (event.key === "Escape" || event.key === " ") skip(event);
    };
    window.addEventListener("keydown", onKey);

    animations.push(
      spineEl.animate(
        [
          { transform: "translate3d(0,0,0) rotateY(0deg)", opacity: 1, offset: 0 },
          {
            transform:
              "translate3d(" + dx * 0.32 + "px," + dy * 0.32 + "px,70px) rotateY(10deg)",
            opacity: 1,
            offset: 0.38,
          },
          {
            transform:
              "translate3d(" + dx + "px," + dy + "px,190px) rotateY(88deg)",
            opacity: 0,
            offset: 0.86,
          },
        ],
        { duration: 1050, easing: "cubic-bezier(.22,.8,.2,1)", fill: "forwards" }
      )
    );

    animations.push(
      bookEl.animate(
        [
          {
            transform:
              "translate3d(" + dx + "px," + dy + "px,0) rotateY(-88deg) scale(" +
              (rect.width / targetW) + "," + (rect.height / targetH) + ")",
            opacity: 0,
            offset: 0,
          },
          {
            transform:
              "translate3d(" + dx * 0.45 + "px," + (dy * 0.45 - 24) + "px,90px) rotateY(-42deg) scale(.62,.68)",
            opacity: 0.45,
            offset: 0.34,
          },
          {
            transform: "translate3d(0,0,190px) rotateY(0deg) scale(1,1)",
            opacity: 1,
            offset: 0.84,
          },
          {
            transform: "translate3d(0,0,190px) rotateY(0deg) scale(1,1)",
            opacity: 1,
            offset: 1,
          },
        ],
        { duration: 1350, delay: 60, easing: "cubic-bezier(.22,.8,.2,1)", fill: "forwards" }
      )
    );

    Promise.allSettled(animations.map((animation) => animation.finished)).then(() => {
      if (finished) return;
      // 表紙を開く
      const open = coverEl.animate(
        [
          { transform: "rotateY(0deg)", offset: 0 },
          { transform: "rotateY(-16deg)", offset: 0.22 },
          { transform: "rotateY(-168deg)", offset: 1 },
        ],
        { duration: 980, easing: "cubic-bezier(.6,.04,.2,1)", fill: "forwards" }
      );
      animations.push(open);
      open.finished.then(() => {
        if (finished) return;
        window.removeEventListener("keydown", onKey);
        window.setTimeout(() => finish(false), 260);
      }).catch(() => {});
    });
  }

  window.Takeout = { play: play };
})();


(function () {
  const spines = Array.from(document.querySelectorAll(".spine"));
  spines.forEach((spine) => {
    spine.addEventListener("click", () => {
      const href = spine.dataset.href || (spine.dataset.slug + ".html");
      window.Takeout.play(spine, {
        onDone: function () { window.location.href = href; }
      });
    });
  });
})();

</script>
</body>
</html>
